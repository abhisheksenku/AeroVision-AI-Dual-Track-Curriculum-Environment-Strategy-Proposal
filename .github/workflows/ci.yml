name: AeroVision AI Production CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Lint, Tests & MLOps Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies (OpenCV)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install onnx onnxruntime

      - name: Run Backend Integration & MLOps Test Suites
        run: |
          python backend/tests/test_cv_pipeline.py
          python backend/tests/test_tracking_pipeline.py
          python backend/tests/test_analytics_pipeline.py
          python backend/tests/test_llm_reporter.py
          python backend/tests/test_rag_pipeline.py
          python backend/tests/test_agent_graph.py
          python backend/tests/test_mlops_pipeline.py

  frontend-build:
    name: Frontend TypeScript Verification & Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Production Frontend Artifacts
        working-directory: frontend
        run: npm run build

  docker-lint:
    name: Dockerfile & Compose Schema Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Compose Config
        run: docker compose config
